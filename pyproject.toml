[project]
name = "Hours-Tracker"
version = "0.1.0"
authors = [{ name = "Hours Tracker Contributors" }]
description = "A simple CLI application for tracking hours in a CSV file."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic >= 2.13",
    "rich >= 15",
    "typer >= 0.25",
]

[project.optional-dependencies]

[project.scripts]
hours = "hours:main"

[tool.flit.module]
name = "hours"
